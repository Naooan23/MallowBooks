name: CI Pipeline

on:
  push:
    branches: [ main, master, naooan-admin-dashboard ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Server/requirements.txt
          pip install pytest flake8

      - name: Lint with Flake8
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 Server --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://Naomi:123456789@localhost:5432/MallowBooks
          JWT_SECRET: test-secret-key-32-characters-length
        run: |
          pytest Server/tests/

  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cliente-app/package-lock.json

      - name: Install Dependencies
        working-directory: cliente-app
        run: npm ci

      - name: TypeScript Check
        working-directory: cliente-app
        run: npx tsc -b

      - name: Build Frontend
        working-directory: cliente-app
        run: npm run build
