services:
  db:
    image: postgres:15-alpine
    container_name: mallow_books_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Naomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-MallowBooks}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - C:\Users\naomi\Downloads\BackUp.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Naomi} -d ${POSTGRES_DB:-MallowBooks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../Server
      dockerfile: Dockerfile
    container_name: mallow_books_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://Naomi:123456789@db:5432/MallowBooks
      JWT_SECRET: ${JWT_SECRET:-mallow-books-secret-key-32-chars-long}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../cliente-app
      dockerfile: Dockerfile
    container_name: mallow_books_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"

volumes:
  postgres_data:
